name: Preus setmanals

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - data/productes.json
      - .github/workflows/preus.yml

permissions:
  contents: write

jobs:
  actualitza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mercadona, Aldi i BonArea (nomes peticions HTTP)
        working-directory: scripts
        run: |
          for botiga in mercadona aldi bonarea; do
            python3 preus_$botiga.py || echo "::warning::$botiga ha fallat, es conserven els preus anteriors"
          done
      - name: Bonpreu Esclat (navegador real, pot ser bloquejat pel WAF)
        continue-on-error: true
        working-directory: scripts
        shell: bash
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 preus_esclat.py 2>&1 | tee ../data/log_esclat.txt; exit ${PIPESTATUS[0]}
      - name: Desa els preus si han canviat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/preus.json data/log_esclat.txt
          git diff --cached --quiet || git commit -m "Preus $(date -u +%F)"
          git pull --rebase -q origin main
          git push
