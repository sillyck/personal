name: Preus setmanals

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/preus_mercadona.py
      - data/productes.json
      - .github/workflows/preus.yml

permissions:
  contents: write

jobs:
  actualitza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/preus_mercadona.py
      - name: Desa els preus si han canviat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/preus.json
          git diff --cached --quiet || git commit -m "Preus Mercadona $(date -u +%F)"
          git push
