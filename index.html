<!doctype html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<div id="login-view" class="view">
  <form id="login-form" class="login-card">
    <h1>Casa</h1>
    <p class="subtitle">Gestio de la llar</p>
    <label>Correu
      <input type="email" id="login-email" required autocomplete="username">
    </label>
    <label>Contrasenya
      <input type="password" id="login-password" required autocomplete="current-password">
    </label>
    <button type="submit">Entrar</button>
    <p id="login-error" class="error" hidden></p>
  </form>
</div>

<div id="app-view" class="view" hidden>
  <header class="topbar">
    <div class="brand">Casa</div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="tasques">Tasques</button>
      <button class="tab-btn" data-tab="proactiva">Vida Proactiva</button>
      <button class="tab-btn" data-tab="estadistiques">Estadistiques</button>
      <button class="tab-btn" data-tab="mapa">Mapa</button>
    </nav>
    <button id="logout-btn" class="ghost-btn">Sortir</button>
  </header>

  <main class="content">
    <section id="tab-tasques" class="tab-panel">
      <div class="panel-header">
        <div class="filters">
          <input type="search" id="filter-search" placeholder="Cerca per nom...">
          <select id="filter-room"><option value="">Totes les habitacions</option></select>
          <select id="filter-category"><option value="">Totes les categories</option></select>
          <select id="filter-effort"><option value="">Tot l'esforç</option></select>
        </div>
        <button id="new-task-btn" class="primary-btn">+ Nova tasca</button>
      </div>
      <div class="kanban" id="kanban"></div>
    </section>

    <section id="tab-proactiva" class="tab-panel" hidden>
      <nav class="subtabs" id="proactive-subtabs"></nav>
      <div class="proactive-grid" id="proactive-grid"></div>
    </section>

    <section id="tab-estadistiques" class="tab-panel" hidden>
      <div class="stats-grid" id="stats-grid"></div>
    </section>

    <section id="tab-mapa" class="tab-panel" hidden>
      <p class="map-intro">Fes clic a un país per marcar-lo com a visitat i afegir-hi llocs i fotos. Nomes tu (Jordi) hi tens accés.</p>
      <div id="travel-map"></div>
    </section>
  </main>
</div>

<div id="task-modal" class="modal" hidden>
  <form id="task-form" class="modal-card">
    <h2 id="task-modal-title">Nova tasca</h2>
    <label>Titol
      <input type="text" id="task-title" required>
    </label>
    <label>Habitacio
      <select id="task-room"></select>
    </label>
    <label>Categoria
      <select id="task-category"></select>
    </label>
    <label>Esforç
      <select id="task-effort"></select>
    </label>
    <div class="field-group">
      <span class="field-label">Freqüencia habitual</span>
      <div class="preset-row" id="frequency-presets"></div>
    </div>
    <label>Cada quants dies
      <input type="number" id="task-interval" min="1" value="7" required>
    </label>
    <div class="field-group">
      <span class="field-label">Dies preferits (opcional)</span>
      <div class="weekday-row" id="task-weekdays"></div>
    </div>
    <label>Prioritat
      <select id="task-priority"></select>
    </label>
    <label>Qui ho fa
      <select id="task-assignee"></select>
    </label>
    <div class="modal-actions">
      <button type="button" id="task-cancel" class="ghost-btn">Cancel·la</button>
      <button type="submit" class="primary-btn">Desa</button>
    </div>
  </form>
</div>

<div id="blocked-modal" class="modal" hidden>
  <form id="blocked-form" class="modal-card">
    <h2>Motiu del bloqueig</h2>
    <label>Per que esta bloquejada aquesta tasca?
      <input type="text" id="blocked-reason" required placeholder="Ex: falta comprar producte">
    </label>
    <div class="modal-actions">
      <button type="button" id="blocked-cancel" class="ghost-btn">Cancel·la</button>
      <button type="submit" class="primary-btn">Bloqueja</button>
    </div>
  </form>
</div>

<div id="country-modal" class="modal" hidden>
  <div class="modal-card">
    <h2 id="country-modal-title">País</h2>
    <div id="country-places-list"></div>
    <form id="place-form">
      <label id="place-region-field" hidden>Regio
        <select id="place-region"></select>
      </label>
      <label>Nom del lloc (opcional)
        <input type="text" id="place-name" placeholder="Ex: Roma">
      </label>
      <label>Des de quan
        <input type="date" id="place-date-from" required>
      </label>
      <label>Fins quan (opcional)
        <input type="date" id="place-date-to">
      </label>
      <label>Notes (opcional)
        <input type="text" id="place-notes">
      </label>
      <label>Foto (opcional)
        <input type="file" id="place-photo" accept="image/*">
      </label>
      <div class="modal-actions">
        <button type="button" id="country-close" class="ghost-btn">Tanca</button>
        <button type="submit" class="primary-btn">Afegeix</button>
      </div>
    </form>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
